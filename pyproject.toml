[tool.poetry]
name = "qsartuna"
version = "4.0.1"
description = "QSARTUNA: QSAR using Optimization for Hyperparameter Tuning"
authors = ["Molecular AI, AstraZeneca"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "optunaz" },
    { include = "qsartuna" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = "^1.26.4"
scipy = "^1.16.0"
pandas = "2.3.0"
jsonpickle = "^2.0"
xgboost = "^3.0.2"
rdkit = ">=2024"
scikit-learn = "1.6.1"
typing-extensions = ">=4.10.0"
apischema = "^0.19"
torch = ">=2.5.0"
prf = {git = "https://github.com/ireis/PRF.git", rev = "7ed097c26bbe9af0df0e724ac3b720f534cdc510"}  # There are no releases or tags, let's take the latest commit.
jazzy = "0.1.4"
shap = "0.48.0"
MAPIE = "0.9.1"
protobuf = ">=5.26.0"
tensorboard = "^2.19.0"
chemprop = "^2.2.1"
catboost = "^1.2.8"
dill = "^0.3.9"
tabpfn = "2.1.3"
tabpfn-extensions = {version = "0.1.3", extras = ["all"]}
scikit-multilearn = "^0.2.0"
mordredcommunity = "^2.0.6"
fastprop = "^1.1.3"

[tool.poetry.group.optimization.dependencies]
mlflow = "^1.19"
sqlalchemy = "1.4.46"
optuna = "^3.1.1"

[tool.poetry.group.tests.dependencies]
pytest = ">=6.2, <8.0"
pytest-datadir = "^1.3"

[tool.poetry.group.dev.dependencies]
pydantic = ">=2.8.0"
coverage = "^7.6.1"
matplotlib = ">=3.7.1"
nbsphinx = "^0.8"
notebook = "^6.4"
black = "*"
isort = "*"
recommonmark = "^0.7"
seaborn = "0.13.2"
sphinx = "5.0.2"
sphinx-apischema = "^0.1"
sphinx-rtd-theme = "^1.0.0"
autodoc-pydantic = "^1.8.0"
sphinx-pydantic = "^0.1.1"
pandoc = "^2.4"
plotly = "5.15.0"
huggingface-hub = "^0.33.0"

[tool.poetry.group.automl.dependencies]
pid = "3.0.4"

[tool.poetry.group.peptide.dependencies]
peptides = "0.3.2"
chemistry-adapters = "0.0.2"
mapchiral = "0.0.5"
amorprot = "0.0.5"

[tool.poetry.scripts]
qsartuna-optimize = "qsartuna.optbuild:main"
qsartuna-build = "qsartuna.optbuild:main"
qsartuna-predict = "qsartuna.predict:main"
qsartuna-schemagen = "qsartuna.schemagen:main"
qsartuna-automl = "qsartuna.automl:main"
qsartuna-metadata = "qsartuna.automl:meta"
qsartuna-convert = "qsartuna.convert:main"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"


[[tool.poetry.source]]
name = "fpho"
url = "https://files.pythonhosted.org"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"
